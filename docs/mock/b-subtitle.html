<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>案B 字幕と履歴</title>
<link rel="stylesheet" href="mock-base.css">
<style>
  body { display: flex; flex-direction: column; height: 100dvh; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; grid-template-rows: auto minmax(0, 1fr); gap: 12px; padding: 12px; }

  /* "now": the sentence being spoken, always in the same place */
  #now {
    grid-column: 1 / -1; background: var(--live-bg); border: 1px solid var(--live-line); border-radius: 14px;
    padding: 14px 18px; min-height: 128px; display: flex; flex-direction: column; justify-content: center;
  }
  #now .state { font-size: 12px; color: var(--accent); display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  #now .state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  #now.speaking .state::before { animation: pulse 1s infinite; }
  #now.done .state { color: var(--dim); }
  #now.done .state::before { background: var(--dim); }
  #now .ja { font-size: 26px; line-height: 1.5; font-weight: 600; }
  #now.speaking .ja { color: var(--ink-2); }
  #now .en { font-size: 14px; }

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-height: 0; position: relative; display: flex; flex-direction: column; }
  .panel h2 { margin: 0; padding: 9px 14px; font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--line-soft); }

  /* history: newest on top, right under the subtitle */
  #hist { flex: 1; overflow-y: auto; padding: 4px 14px 14px; }
  .h { padding: 10px 0; border-bottom: 1px solid var(--line-soft); animation: rise .25s ease-out; }
  .h .ja { font-size: 16px; line-height: 1.6; }
  .h:first-child .ja { color: var(--ink); }
  .h:not(:first-child) .ja { color: var(--ink-2); }
  .turn { font-size: 11px; color: var(--amber); padding: 6px 0 0; }

  #insightBox { padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  .label { font-size: 12px; color: var(--dim); margin-top: 4px; }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; padding: 8px; }
    #now { min-height: 120px; padding: 12px 14px; }
    #now .ja { font-size: 22px; }
    #now { order: 0; } .ins { order: 1; } .histp { order: 2; }
    .ins h2 { display: none; }
    #insightBox { padding: 10px 12px; gap: 6px; }
    .need { font-size: 16px; }
    .ins:not(.open) .more { display: none; }
    .ins .toggle { display: block; }
  }
  .toggle { display: none; border: 0; background: none; color: var(--accent); font-size: 12px; text-align: left; padding: 0; }
</style>
</head>
<body>
<div class="bar">
  <h1>Meeting Assist</h1>
  <button class="rec on" title="録音停止"></button>
  <div class="seg"><span class="k">入力</span><button class="on">会議の音声</button><button>マイク</button></div>
  <div class="seg"><span class="k">ASR</span><button>Deepgram</button><button class="on">Nemotron</button></div>
  <span class="conn">録音中 · Nemotron</span>
  <span class="help"><button class="icon" id="helpBtn" title="使い方">?</button>
    <div class="pop" id="helpPop" hidden><b>会議の音声</b>：共有画面で「画面全体」を選び「システム音声を共有」をオン（Zoom / Teams アプリでも可）。ブラウザ会議ならその「タブ」を選び「タブの音声を共有」をオン。</div></span>
  <button class="icon" id="theme" title="テーマ"></button>
</div>

<main>
  <section id="now" class="done">
    <div class="state">待機中</div>
    <div class="ja">相手が話すと、ここに大きく訳が出ます</div>
    <div class="en"></div>
  </section>

  <section class="panel histp">
    <h2>これまでの会話（新しい順）</h2>
    <div id="hist"></div>
  </section>

  <aside class="panel ins" id="ins">
    <h2>💡 相手の本音</h2>
    <div id="insightBox"><p class="thinking">相手が話し終えると表示されます</p></div>
  </aside>
</main>

<script src="mock-data.js"></script>
<script>
  setupTheme(document.getElementById("theme"));
  const helpBtn = document.getElementById("helpBtn"), helpPop = document.getElementById("helpPop");
  helpBtn.onclick = () => (helpPop.hidden = !helpPop.hidden);
  const now = document.getElementById("now"), hist = document.getElementById("hist"), box = document.getElementById("insightBox"), ins = document.getElementById("ins");
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  let lastFinal = null, pendingSep = false;
  const setNow = (state, cls, ja, en) => {
    now.className = cls; now.querySelector(".state").textContent = state;
    now.querySelector(".ja").textContent = ja; now.querySelector(".en").textContent = en;
  };
  const pushHist = (html) => { hist.insertAdjacentHTML("afterbegin", html); hist.scrollTo({ top: 0, behavior: "smooth" }); };
  const toggleBtn = () => `<button class="toggle" onclick="document.getElementById('ins').classList.toggle('open')">返事の案を見る / 閉じる</button>`;

  startDemo({
    onReset() { hist.innerHTML = ""; lastFinal = null; pendingSep = false; setNow("待機中", "done", "相手が話すと、ここに大きく訳が出ます", ""); box.innerHTML = '<p class="thinking">相手が話し終えると表示されます</p>'; },
    onLive({ en, ja }) {
      // the previous sentence leaves the subtitle only when the next one starts (no duplicate on screen)
      if (lastFinal) { pushHist(`<div class="h"><div class="ja">${esc(lastFinal.ja)}</div><div class="en">${esc(lastFinal.en)}</div></div>`); lastFinal = null; }
      if (pendingSep) { pushHist(`<div class="turn">── 相手が話し終えました</div>`); pendingSep = false; }
      setNow("話し中", "speaking", ja, en);
    },
    onFinal(f) { setNow("確定", "done", f.ja, f.en); lastFinal = f; },
    onTurnEnd() {
      pendingSep = true;
      now.querySelector(".state").textContent = "相手が話し終えました";
      box.innerHTML = '<p class="thinking">本音を考え中<span class="dots"></span></p>';
    },
    onInsightPartial({ situation, need }) {
      box.innerHTML = `<div class="situation">相手は${esc(situation)}</div><div class="need">${esc(need)}</div><div class="more"><div class="label">返事の案</div><p class="thinking">考え中<span class="dots"></span></p></div>${toggleBtn()}`;
    },
    onInsight(i) {
      box.innerHTML = `<div class="situation">相手は${esc(i.situation)}</div><div class="need">${esc(i.need)}</div>
        <div class="more"><div class="label">返事の案</div>${i.replies.map((r) => `<div class="reply">${esc(r)}</div>`).join("")}</div>${toggleBtn()}`;
    },
  });
</script>
</body>
</html>
